services:
  # ─────────────────────────────────────
  # FastAPI Backend Web Service
  # ─────────────────────────────────────
  - type: web
    name: chaintrack-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chaintrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        # Replace with your actual Vercel URL after first deploy
        value: https://chaintrack.vercel.app,http://localhost:5173
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ─────────────────────────────────────
  # Alembic Migration Job (runs on deploy)
  # ─────────────────────────────────────
  - type: worker
    name: chaintrack-migrate
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chaintrack-db
          property: connectionString

databases:
  # ─────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────
  - name: chaintrack-db
    databaseName: chaintrack
    user: chaintrack
    plan: free
    region: oregon

services:
  # ─────────────────────────────────────
  # FastAPI Backend Web Service (Neon DB)
  # ─────────────────────────────────────
  - type: web
    name: chaintrack-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        # Paste your full Neon connection string here in Render Dashboard
        # Format: postgresql+psycopg2://user:password@host/dbname?sslmode=require&channel_binding=require
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        # Replace with your actual Vercel URL after first deploy
        value: https://chaintrack.vercel.app,http://localhost:5173
      - key: PYTHON_VERSION
        value: "3.11.0"
